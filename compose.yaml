name: private-radius-lab
services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: radius
      POSTGRES_DB: radius
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run ./scripts/setup.sh first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/001_app.sql:/docker-entrypoint-initdb.d/001_app.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U radius -d radius"]
      interval: 5s
      retries: 20
      timeout: 3s
    networks:
      - private

  schema-init:
    build: ./radius
    restart: "no"
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    entrypoint: ["/bin/bash", "/usr/local/bin/schema-init.sh"]
    volumes:
      - ./database/001_app.sql:/opt/radius/001_app.sql:ro
      - ./database/002_lab_accounts.sql:/opt/radius/002_lab_accounts.sql:ro
      - ./database/003_accounting.sql:/opt/radius/003_accounting.sql:ro
      - ./database/004_nas_drafts.sql:/opt/radius/004_nas_drafts.sql:ro
      - ./database/005_admin_identity.sql:/opt/radius/005_admin_identity.sql:ro
      - ./database/006_reseller_ownership.sql:/opt/radius/006_reseller_ownership.sql:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - private

  radius:
    build: ./radius
    restart: unless-stopped
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      RADIUS_SECRET: ${RADIUS_SECRET:?Set RADIUS_SECRET}
      RADIUS_CLIENT_CIDR: ${RADIUS_CLIENT_CIDR:-10.255.70.0/24}
    ports:
      - "${RADIUS_BIND_IP:-127.0.0.1}:1812:1812/udp"
      - "${RADIUS_BIND_IP:-127.0.0.1}:1813:1813/udp"
    healthcheck:
      test: ["CMD", "/usr/local/bin/radius-health-publish.sh"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - radius_health:/var/lib/radius-health
    depends_on:
      schema-init:
        condition: service_completed_successfully
    networks:
      - private

  api:
    build: ./src/RadiusManager.Api
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__RadiusDb: "Host=db;Port=5432;Database=radius;Username=radius;Password=${DB_PASSWORD:?Set DB_PASSWORD}"
      RADIUS_SERVICE_HISTORY_PERSIST: "1"
      RADIUS_ADMIN_AUTH_MODE: ${RADIUS_ADMIN_AUTH_MODE:-basic}
      RADIUS_ADMIN_USER: ${ADMIN_USER:-admin}
      RADIUS_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:8080:8080/tcp"
    volumes:
      - radius_health:/var/lib/radius-health:ro
      - service_history:/var/lib/radius-service-history
    depends_on:
      schema-init:
        condition: service_completed_successfully
    networks:
      - private

volumes:
  postgres_data:
  radius_health:
  service_history:

networks:
  private:
    driver: bridge
