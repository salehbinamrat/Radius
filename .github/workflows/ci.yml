name: Radius lab CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dotnet-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact workflow checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: dotnet restore tests/RadiusManager.Tests/RadiusManager.Tests.csproj --locked-mode -p:NuGetAudit=true -p:NuGetAuditMode=all -p:NuGetAuditLevel=low
      - name: Verify NuGet lockfiles unchanged
        run: git diff --exit-code -- src/RadiusManager.Api/packages.lock.json tests/RadiusManager.Tests/packages.lock.json
      - run: dotnet test tests/RadiusManager.Tests/RadiusManager.Tests.csproj --no-restore -c Release
      - name: Publish the tested API on a clean CI host
        run: dotnet publish src/RadiusManager.Api/RadiusManager.Api.csproj --no-restore -c Release --no-self-contained -o /tmp/radius-api-publish
      - name: Verify compiled C# migration catalog against the legacy catalog
        run: |
          dotnet /tmp/radius-api-publish/RadiusManager.Api.dll --migration-preflight database > /tmp/radius-migration-catalog.tsv
          python3 tests/migration_catalog_parity.py /tmp/radius-migration-catalog.tsv
  config-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact workflow checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node@v4
        with: { node-version: '24' }
      - run: python3 scripts/check-tracked-secrets.py
      - run: bash scripts/ci-config-checks.sh
      - name: 'React + TypeScript: compile and verify bundled dashboard component'
        run: |
          cd src/RadiusManager.Api/frontend
          npm ci --no-audit --no-fund --ignore-scripts
          npm audit --audit-level=high --include=dev --include=optional
          npm run check
          npm run build
          node --check ../wwwroot/modern/noc-react.mjs
          if grep -Fq 'process.env.NODE_ENV' ../wwwroot/modern/noc-react.mjs; then
            echo 'Vite library bundle retained Node process.env; browser startup unsafe' >&2
            exit 1
          fi
      - name: Audit browser-test dependencies
        run: npm audit --prefix tests/browser --package-lock-only --audit-level=high --include=dev --include=optional
      - name: Verify frontend lockfile unchanged
        run: git diff --exit-code -- src/RadiusManager.Api/frontend/package-lock.json
  compose-integration:
    needs: [dotnet-tests, config-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact workflow checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node@v4
        with: { node-version: '24' }
      - run: bash scripts/setup.sh
      - name: 'Loopback lab port preflight'
        env:
          LAB_NETWORK_PREFLIGHT_ACK: isolated-lab
        run: bash scripts/lab-deployment-preflight.sh
      - run: docker compose config --quiet
      - run: docker compose up -d --build
      - name: Verify API runtime-only package contents
        env:
          RADIUS_PACKAGE_TEST_ACK: isolated-ci
        run: bash scripts/runtime-package-smoke.sh
      - name: Record actual PostgreSQL image provenance
        run: |
          image=$(docker inspect --format '{{.Image}}' "$(docker compose ps -q db)")
          test "$image" = "$(docker image inspect radius-postgres-local:16.16-icu --format '{{.Id}}')"
          docker image inspect "$image" --format '{{.Id}} {{json .RootFS.Layers}}'
          docker compose exec -T db psql -X -qAt -v ON_ERROR_STOP=1 -U radius -d radius -c "SELECT CASE WHEN datlocprovider='i' AND daticulocale='en-US' AND datcollversion=pg_database_collation_actual_version(oid) THEN 'ICU_LOCALE_OK' ELSE 'ICU_LOCALE_INVALID' END FROM pg_database WHERE datname=current_database()" | grep -qx ICU_LOCALE_OK
      - name: API ready
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/api/health/ready; then exit 0; fi
            sleep 3
          done
          docker compose logs --no-color
          exit 1
      - name: 'Read-only API latency baseline'
        env:
          RADIUS_PERF_TEST_ACK: isolated-ci
        run: bash scripts/lab-read-performance.sh
      - name: 'Accounting query baseline and candidate index comparison (100k synthetic rows)'
        env:
          RADIUS_PERF_TEST_ACK: isolated-ci
        run: bash scripts/accounting-query-performance.sh
      - run: bash scripts/api-contract-smoke.sh
      - name: 'Lab data boundary and foreign RADIUS rows'
        env:
          LAB_SCOPE_ACK: isolated-ci
        run: bash scripts/lab-scope-smoke.sh
      - run: bash scripts/admin-identity-smoke.sh
      - run: bash scripts/concurrent-plan-smoke.sh
      - run: bash scripts/smoke-test.sh
      - name: 'FreeRADIUS authenticated loopback Status-Server probe'
        env:
          LAB_RADIUS_STATUS_ACK: isolated-ci
        run: bash scripts/radius-health-smoke.sh
      - name: Strict RADIUS authenticator acceptance
        env:
          LAB_RADIUS_AUTHENTICATOR_ACK: isolated-ci
        run: bash scripts/radius-authenticator-smoke.sh
      - name: Bounded service observation history acceptance
        env:
          LAB_SERVICE_HISTORY_ACK: isolated-ci
        run: bash scripts/service-history-smoke.sh
      - name: 'Isolated PostgreSQL incident, restart and recovery acceptance'
        env:
          LAB_INCIDENT_FAILURE_ACK: isolated-ci
        run: bash scripts/incident-recovery-smoke.sh
      - run: bash scripts/lab-account-smoke.sh
      - run: bash scripts/accounting-smoke.sh
      - run: bash scripts/accounting-wire-smoke.sh
      - run: bash scripts/ui-smoke.sh
      - name: 'Browser smoke: Chromium + React'
        run: |
          npm ci --prefix tests/browser --no-audit --no-fund --ignore-scripts
          tests/browser/node_modules/.bin/playwright install --with-deps chromium
          tests/browser/node_modules/.bin/playwright test --config tests/browser/playwright.config.mjs
      - name: Verify browser lockfile unchanged
        run: git diff --exit-code -- tests/browser/package-lock.json
      - run: bash scripts/lab-sessions-smoke.sh
      - run: bash scripts/nas-drafts-smoke.sh
      - name: 'Versioned migrations: isolated rollback, mixed legacy and concurrent starts'
        env:
          MIGRATION_TEST_ACK: isolated-lab
        run: bash scripts/migration-ledger-smoke.sh
      - name: C# candidate fresh installation and encrypted recovery
        env:
          CSHARP_INSTALL_TEST_ACK: isolated-ci
        run: bash scripts/csharp-install-candidate-smoke.sh
      - name: C# isolated full-stack installation acceptance
        env:
          CSHARP_STACK_TEST_ACK: isolated-ci
        run: bash scripts/csharp-stack-candidate-smoke.sh
      - name: C# initializer upgrade from a populated legacy Python installation
        env:
          CSHARP_STACK_TEST_ACK: isolated-ci
        run: bash scripts/csharp-stack-candidate-smoke.sh legacy-upgrade
      - name: Explicit local C# initializer full-stack acceptance without CI authorization
        env:
          CSHARP_STACK_TEST_ACK: isolated-ci
        run: bash scripts/csharp-stack-candidate-smoke.sh local-fresh
      - name: Actual local C# installation entry point acceptance
        env:
          CSHARP_LOCAL_INSTALL_TEST_ACK: isolated-ci
        run: bash scripts/csharp-local-installer-smoke.sh
      - name: Encrypted backup, isolated restore and migration replay
        run: bash scripts/lab-recovery-smoke.sh
      - name: 'HTTPS Identity acceptance in a dedicated disposable Docker project'
        env:
          LAB_HTTPS_TEST_ACK: isolated-ci
        run: bash scripts/admin-https-smoke.sh
      - name: HTTPS Identity acceptance after C# initializer
        env:
          LAB_HTTPS_TEST_ACK: isolated-ci
        run: bash scripts/admin-https-smoke.sh csharp
      - name: Reduced RADIUS runtime candidate and size comparison
        id: slim_candidate
        env:
          RADIUS_SLIM_TEST_ACK: isolated-ci
        run: bash scripts/radius-slim-candidate-smoke.sh
      - name: Mandatory image vulnerability scan and SBOM
        id: security_scan
        env:
          LAB_SECURITY_SCAN_ACK: isolated-ci
        run: bash scripts/security-scan-ci.sh
      - name: Retain security reports
        if: always() && (steps.slim_candidate.outcome == 'failure' || steps.security_scan.outcome == 'success' || steps.security_scan.outcome == 'failure')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: radius-security-reports
          path: ${{ runner.temp }}/radius-security-reports/
          if-no-files-found: error
          retention-days: 14
      - name: Diagnose failed RADIUS integration
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=160 radius schema-init db api
      - if: always()
        run: docker compose down --remove-orphans
