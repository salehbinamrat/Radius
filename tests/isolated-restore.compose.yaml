# Separate disposable PostgreSQL service for a CI-only restore drill.
# Always run with `docker compose -p radiusrestoreXXXXXXXX -f tests/isolated-restore.compose.yaml`.
# NEVER point this project at the application's postgres_data volume.
services:
  restore-db:
    image: radius-postgres-local:16.16-icu
    pull_policy: never
    restart: 'no'
    environment:
      POSTGRES_USER: radius
      POSTGRES_DB: radius
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run scripts/setup.sh for the isolated lab}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U radius -d radius']
      interval: 2s
      timeout: 3s
      retries: 30
