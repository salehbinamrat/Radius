# ISOLATED CI LAB ONLY: dedicated PostgreSQL volume and TLS-only localhost API.
# Reuses previously tested immutable image IDs tagged by admin-https-smoke.sh.
# Never bring up under the production Radius project.
services:
  db:
    image: postgres:16-bookworm
    restart: "no"
    environment:
      POSTGRES_USER: radius
      POSTGRES_DB: radius
      POSTGRES_PASSWORD_FILE: /run/radius-secrets/db-password
    volumes:
      - https_pg_data:/var/lib/postgresql/data
      - ${RADIUS_HTTPS_SECRET_DIR:?Private temporary secret directory required}/db-password:/run/radius-secrets/db-password:ro
      - ../database/001_app.sql:/docker-entrypoint-initdb.d/001_app.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U radius -d radius"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [private]

  schema-init:
    image: radius-stage3-ci-schema:latest
    restart: "no"
    environment:
      DB_PASSWORD_FILE: /run/radius-secrets/db-password
    entrypoint: ["/bin/bash", "/usr/local/bin/schema-init.sh"]
    volumes:
      - ${RADIUS_HTTPS_SECRET_DIR:?Private temporary secret directory required}/db-password:/run/radius-secrets/db-password:ro
      - ../database/001_app.sql:/opt/radius/001_app.sql:ro
      - ../database/002_lab_accounts.sql:/opt/radius/002_lab_accounts.sql:ro
      - ../database/003_accounting.sql:/opt/radius/003_accounting.sql:ro
      - ../database/004_nas_drafts.sql:/opt/radius/004_nas_drafts.sql:ro
      - ../database/005_admin_identity.sql:/opt/radius/005_admin_identity.sql:ro
      - ../database/006_reseller_ownership.sql:/opt/radius/006_reseller_ownership.sql:ro
      - ../database/007_ownership_transfers.sql:/opt/radius/007_ownership_transfers.sql:ro
      - ../database/008_audit_append_only.sql:/opt/radius/008_audit_append_only.sql:ro
    depends_on:
      db: {condition: service_healthy}
    networks: [private]

  api:
    image: radius-stage3-ci-api:latest
    restart: "no"
    environment:
      ASPNETCORE_URLS: https://+:8443
      ASPNETCORE_Kestrel__Certificates__Default__Path: /run/radius-tls/server.pfx
      RADIUS_TLS_PASSWORD_FILE: /run/radius-secrets/tls-password
      RADIUS_ADMIN_DATA_PROTECTION_PATH: /var/lib/radius-admin-keys
      ConnectionStrings__RadiusDb: "Host=db;Port=5432;Database=radius;Username=radius"
      RADIUS_DB_PASSWORD_FILE: /run/radius-secrets/db-password
      RADIUS_SERVICE_HISTORY_PERSIST: "1"
      RADIUS_ADMIN_AUTH_MODE: session
      RADIUS_ADMIN_USER: ${ADMIN_USER:-admin}
    ports:
      - "127.0.0.1:18443:8443/tcp"
    volumes:
      - ${RADIUS_HTTPS_FIXTURE_DIR:?Temporary fixture directory required}:/run/radius-tls:ro
      - ${RADIUS_HTTPS_SECRET_DIR:?Private temporary secret directory required}/db-password:/run/radius-secrets/db-password:ro
      - ${RADIUS_HTTPS_SECRET_DIR:?Private temporary secret directory required}/tls-password:/run/radius-secrets/tls-password:ro
      - admin_dp_keys:/var/lib/radius-admin-keys
      - https_service_history:/var/lib/radius-service-history
    depends_on:
      schema-init: {condition: service_completed_successfully}
    networks: [private]

volumes:
  https_pg_data:
  admin_dp_keys:
  https_service_history:
networks:
  private:
    driver: bridge
