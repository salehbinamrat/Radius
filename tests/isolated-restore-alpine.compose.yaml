# CI-only logical restoration to the exact scanned local image.
# No published ports, bind mounts, or shared application volumes.
services:
  restore-db:
    image: ${LAB_RESTORE_CANDIDATE_IMAGE:?Missing CI candidate image}
    pull_policy: never
    restart: 'no'
    environment:
      POSTGRES_USER: radius
      POSTGRES_DB: radius
      # Explicit portable locale for the new, disposable cluster only.
      # Existing Debian volumes must never be initialized or mounted here.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=en-US --locale=en_US.utf8 --encoding=UTF8"
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run scripts/setup.sh for isolated lab}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U radius -d radius']
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - restore-private
networks:
  restore-private:
    internal: true
